name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.10', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run CLI regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build --outdir "$RUNNER_TEMP/barline-dist"
          python -m twine check "$RUNNER_TEMP"/barline-dist/*
      - name: Verify isolated wheel and sdist installations
        run: |
          for artifact in "$RUNNER_TEMP"/barline-dist/*; do
            install_env=$(mktemp -d "$RUNNER_TEMP/barline-install.XXXXXX")
            python -m venv "$install_env"
            "$install_env/bin/python" -m pip install "$artifact"
            python -B tests/smoke_distribution.py "$install_env/bin/python"
          done
